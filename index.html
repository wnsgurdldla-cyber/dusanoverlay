<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>백두산 오버레이</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
    body { background-color: transparent; margin: 0; padding: 0; width: 320px; height: 800px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .card-container { position: relative; width: 280px; height: 760px; background: #0f172a; border: 1px solid #334155; border-radius: 24px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    .bg-art { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .mountain-shape { position: absolute; bottom: 0; width: 100%; height: 50%; opacity: 0.3; }
    .header { position: relative; z-index: 2; width: 100%; text-align: center; margin-bottom: 12px; }
    .badge { display: inline-block; background: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.4); padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
    .target-title { color: #ffffff; font-size: 24px; font-weight: 900; margin: 0; }
    .balloon-stats { margin-top: 6px; font-size: 13px; color: #94a3b8; }
    .balloon-stats strong { color: #ffcc00; font-size: 14px; }
    .promise-box { position: relative; z-index: 2; width: 100%; background: rgba(255, 255, 255, 0.08); border: 1px dashed rgba(255, 204, 0, 0.5); border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 15px; }
    .promise-label { font-size: 11px; color: #ffcc00; font-weight: bold; margin-bottom: 2px; }
    .promise-text { font-size: 14px; color: #ffffff; font-weight: bold; }
    .gauge-wrapper { position: relative; z-index: 2; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; }
    .gauge-track { position: relative; width: 14px; height: 500px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; }
    .gauge-fill { position: absolute; bottom: 0; width: 100%; height: 0%; background: #ff8c00; border-radius: 8px; transition: height 0.5s ease-out; }
    .red-pin { position: absolute; bottom: 0%; left: 50%; transform: translate(-50%, 50%); width: 60px; height: 60px; background: #cc0033; border: 3px solid #ffffff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: bottom 0.5s ease-out; z-index: 5; }
    .pin-number { color: #ffffff; font-size: 15px; font-weight: 900; }
    .pin-label { color: rgba(255, 255, 255, 0.8); font-size: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="bg-art">
      <svg class="mountain-shape" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path fill="#334155" d="M0,100 L0,60 L30,20 L60,70 L80,35 L100,50 L100,100 Z"/>
        <path fill="#1e293b" d="M0,100 L0,75 L20,45 L45,80 L75,30 L100,65 L100,100 Z"/>
      </svg>
    </div>

    <div class="header">
      <div class="badge" id="levelBadge">STEP 1</div>
      <h1 class="target-title" id="titleText">100두산 도전</h1>
      <div class="balloon-stats">
        <span id="currentBalloons">0</span> / <strong id="targetBalloons">5,050</strong> 개
      </div>
    </div>

    <div class="promise-box">
      <div class="promise-label" id="promiseLabel">100두산 달성 공약</div>
      <div class="promise-text" id="promiseText">노래 1곡 부르기</div>
    </div>

    <div class="gauge-wrapper">
      <div class="gauge-track">
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="red-pin" id="redPin">
          <span class="pin-number" id="pinNumber">0</span>
          <span class="pin-label">두산</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentBalloons = 0;
    let currentLevel = 1;

    let promises = {
      1: "노래 1곡 부르기",
      2: "애교 3종 세트",
      3: "리액션 댄스",
      4: "시청자 미션 수행",
      5: "벌칙 음료 마시기"
    };

    function getRequiredBalloons(dusanLevel) {
      const n = dusanLevel * 100;
      return (n * (n + 1)) / 2;
    }

    function updateGauge() {
      let targetBalloons = getRequiredBalloons(currentLevel);

      while (currentBalloons >= targetBalloons) {
        currentLevel++;
        targetBalloons = getRequiredBalloons(currentLevel);
      }

      const percentage = Math.min((currentBalloons / targetBalloons) * 100, 100);

      document.getElementById('gaugeFill').style.height = percentage + '%';
      document.getElementById('redPin').style.bottom = percentage + '%';

      const currentDusanStep = Math.floor(Math.sqrt(2 * currentBalloons));
      document.getElementById('pinNumber').innerText = currentDusanStep;

      document.getElementById('currentBalloons').innerText = currentBalloons.toLocaleString();
      document.getElementById('targetBalloons').innerText = targetBalloons.toLocaleString();
      
      const dusanTarget = currentLevel * 100;
      document.getElementById('titleText').innerText = dusanTarget + '두산 도전';
      document.getElementById('levelBadge').innerText = 'STEP ' + currentLevel;

      document.getElementById('promiseLabel').innerText = dusanTarget + '두산 달성 공약';
      document.getElementById('promiseText').innerText = promises[currentLevel] || "자유 공약 진행!";
    }

    function addBalloons(amount) {
      currentBalloons += Number(amount);
      updateGauge();
    }

    function connectWeflab() {
  // 위플랩 서버 소켓 연결 (CORS 및 Transports 옵션 최적화)
  var socket = io('https://ssmain.weflab.com', {
    path: '/socket.io',
    transports: ['polling', 'websocket'], // polling을 우선 시도
    secure: true,
    reconnection: true,
    rejectUnauthorized: false,
    query: { 
      idx: 'iObG0suSk2Vw',
      type: 'goal' // 목표치 전용 타겟 지정
    }
  });

  socket.on('connect', function() {
    console.log('✅ 위플랩 소켓 서버 연결 성공! (ID: iObG0suSk2Vw)');
  });

  socket.on('disconnect', function(reason) {
    console.warn('⚠️ 위플랩 소켓 연결 끊김:', reason);
  });

  socket.on('connect_error', function(error) {
    console.error('❌ 소켓 연결 에러:', error);
  });

  // 모든 수신 데이터 캐치
  socket.onAny(function(eventName, data) {
    console.log('📡 [신호 수신 - ' + eventName + ']:', data);
    parseData(data);
  });
}
    function parseData(data) {
      try {
        if (typeof data === 'string') data = JSON.parse(data);
        
        var count = 0;
        if (typeof data === 'object' && data !== null) {
          count = data.balloon || data.amount || data.count || data.cnt || data.value || data.star || data.qty || (data.data && data.data.count);
        } else if (typeof data === 'number') {
          count = data;
        }

        if (count && !isNaN(Number(count)) && Number(count) > 0) {
          console.log('-> 별풍선 수량 반영:', count);
          addBalloons(Number(count));
        }
      } catch(e) {
        console.error('데이터 해석 오류:', e);
      }
    }

    window.onload = function() {
      updateGauge();
      connectWeflab();
    };
  </script>
</body>
</html>
